plugins:
  ingenic_enabled:
    default: true
    client: true

  # JSON array. Each entry describes one left navigation item so that admins can
  # reorder, hide or relabel the sidebar without a code change.
  #
  # "section" is which of the three blocks the entry belongs to:
  #
  #   forum      the plain list at the top — the forum itself, drawn with no
  #              heading
  #   resources  the block below it, drawn under the theme's heading
  #              (Developer Resources / 开发者资源: the theme's
  #              ingenic_nav_title setting overrides it)
  #   member     rows in the member block below Topics — what a member has
  #              earned or set aside, which is not a developer resource
  #
  # A name outside those three is read as forum. "position" orders entries
  # within their own block, not across blocks: the blocks themselves are always
  # drawn in the order above. Site Feedback and All Categories are not
  # configurable; the member block always carries them.
  #
  # [
  #   { "key": "new-post",    "label": "New Post",               "icon": "plus",      "href": "/new-topic",           "section": "forum",     "position": 0, "enabled": true },
  #   { "key": "home",        "label": "Home",                   "icon": "house",     "href": "/",                    "section": "forum",     "position": 1, "enabled": true },
  #   { "key": "announce",    "label": "Official Announcements", "icon": "bullhorn",  "category": "official-announcements", "section": "forum", "position": 2, "enabled": true },
  #   { "key": "discussions", "label": "Technical Discussions",  "icon": "comments",  "category": "technical-discussions",  "section": "forum", "position": 3, "enabled": true },
  #   { "key": "open-source", "label": "Open Source",            "icon": "code",      "category": "open-source",      "section": "forum",     "position": 4, "enabled": true },
  #   { "key": "docs",        "label": "Online Documentation",   "icon": "book",      "href": "/ingenic/docs",        "section": "resources", "position": 5, "enabled": true },
  #   { "key": "downloads",   "label": "SDK & Firmware Downloads", "icon": "download", "href": "/ingenic/downloads",  "section": "resources", "position": 6, "enabled": true },
  #   { "key": "boards",      "label": "Development Boards",     "icon": "microchip", "href": "/ingenic/boards",      "section": "resources", "position": 7, "enabled": true },
  #   { "key": "mcp",         "label": "MCP",                    "icon": "robot",     "href": "/ingenic/mcp",         "section": "resources", "position": 8, "enabled": true },
  #   { "key": "bounties",    "label": "Bounties",               "icon": "gift",      "href": "/ingenic/bounties",    "section": "member",    "position": 9, "enabled": true },
  #   { "key": "points",      "label": "Points",                 "icon": "star",      "href": "/ingenic/points",      "section": "member",    "position": 10, "enabled": true },
  #   { "key": "github",      "label": "GitHub",                 "icon": "code-branch", "href": "https://github.com/ingenic-official", "section": "resources", "external": true, "position": 11, "enabled": true }
  # ]
  #
  # Left empty, the theme's own defaults are used — the same three blocks, in
  # English, with the same entries.
  #
  # A "category" entry resolves to /c/<slug>, so navigation can point at a forum
  # section instead of a URL. Give each chip its own category and point that
  # chip's "docs" entry at its own /ingenic/docs/<product> prefix.
  ingenic_nav_items:
    default: ""
    type: string
    multiline: true

  # JSON array controlling which blocks appear on the Ingenic home page and in
  # what order. Supported types: categories, latest, hot, popular, activity,
  # announcements, discussions, downloads, boards, bounties, promotions,
  # leaderboard.
  #
  # This is edited on Admin → Plugins → Ingenic → Site content → Home page,
  # which adds, removes and reorders blocks. "layout" is full, main or side;
  # "limit" is how many rows a block draws; "categories" names section slugs in
  # the order to show them; "category" is the section the announcements and
  # discussions blocks read.
  #
  # [
  #   { "type": "categories",    "limit": 3, "categories": "official-announcements, technical-discussions" },
  #   { "type": "latest",        "limit": 8, "layout": "main" },
  #   { "type": "promotions",    "limit": 3, "layout": "side" },
  #   { "type": "hot",           "limit": 5, "layout": "side" },
  #   { "type": "bounties",      "limit": 5, "layout": "full" },
  #   { "type": "announcements", "limit": 5, "category": "official-announcements" },
  #   { "type": "downloads",     "limit": 6 },
  #   { "type": "boards",        "limit": 4 }
  # ]
  ingenic_homepage_blocks:
    default: ""
    type: string
    multiline: true

  # Where the "Discuss in forum" link on a documentation page points when a page
  # has no linked topic yet.
  ingenic_docs_discussion_category:
    default: ""
    type: string
    description: "Category slug used for the 'Discuss in forum' link on a documentation page that has no linked topic."

  # Where uploaded SDKs and firmware are written. The default sits beside the
  # application rather than under public/, because a file the web server serves
  # to anyone who guesses its URL cannot be gated by anything the plugin does.
  # Point this at a larger volume if the downloads outgrow the app disk; keep it
  # outside public/ wherever it points.
  ingenic_download_storage_path:
    default: ""
    type: string
    description: "Directory that holds uploaded SDK and firmware files. Leave empty to use <app>/ingenic-downloads. Must be outside public/."

  # The official-file library: the directory tree the file manager writes into.
  # Real folders and real filenames, so an operator can point a colleague at a
  # path as well as a link. The default sits beside the application rather than
  # under public/, because every file is served through the plugin after a path
  # check; a copy under public/ would be reachable directly and skip it.
  #
  # This is not the download centre's storage. That holds the bytes behind a
  # catalogue row; this holds whatever the team wants to link to before or
  # instead of publishing a row. Keep the two apart.
  ingenic_file_manager_path:
    default: ""
    type: string
    description: "Directory that holds the official file library. Leave empty to use <app>/ingenic-files. Must be outside public/."

  # What the library will accept. The list is the whole policy: a filename whose
  # extension is not here is refused at upload, and the browser is told the same
  # list so its picker can agree. Extensions are case-insensitive and written
  # without the dot.
  ingenic_file_manager_extensions:
    default: "zip,7z,rar,tar,gz,bz2,xz,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,md,csv,png,jpg,jpeg,gif,webp,avif,bin,img"
    type: list
    list_type: compact
    description: "File extensions the official file library accepts."

  # Where an application for an access-restricted resource is sent. Left empty,
  # applications are still recorded and shown in the admin queue, but nobody is
  # emailed about them.
  ingenic_download_admin_email:
    default: ""
    type: string
    description: "Address that receives an email when a developer applies for an access-restricted download."

  # How long a delivery log keeps the account, address and browser of the
  # person who took a file. After this many months those columns are cleared
  # and the row remains as a count. 0 keeps them forever.
  ingenic_download_log_retention_months:
    default: 24
    min: 0
    type: integer
    description: "Months a download log keeps who took the file; the row itself is kept. 0 keeps the details forever."

  # Extra questions appended to the developer information form, as a JSON
  # array. This is the form a visitor fills in for the 'login and information'
  # tier and above.
  #
  # The core questions are fixed in code: who they are (company, student or
  # individual developer), name, country, email, intended use and project
  # stage, plus the company or school questions that follow from the identity.
  # They are what the profile columns and the access rules are built around, so
  # this setting adds to them and cannot remove or rename them.
  #
  # [
  #   { "key": "team_size", "label": "Team size", "type": "text", "required": false }
  # ]
  #
  # "type" is text or textarea. A question whose key asks for a phone number, a
  # chat handle, a postal address or a government identifier is ignored: the
  # form does not collect those.
  ingenic_developer_form_fields:
    default: ""
    type: string
    multiline: true
    description: "JSON array of extra questions for the developer information form. The core questions are fixed."

  # Groups whose members wear an official identity badge beside their username.
  # One group name per entry, spelled as the group is spelled on its own page.
  # Case and stray spaces do not matter.
  #
  # The badge itself is Discourse's own group flair, which the group's own
  # settings already let an admin upload or pick as an icon. This setting only
  # decides who wears it: a member of a listed group is given that group's
  # flair. A member who already wears a badge they chose themselves keeps it,
  # and can pick up the official one from their preferences page instead.
  #
  # Listing more than one group is a way of saying which badge outranks which:
  # the first listed group a member belongs to is the one that wins.
  #
  # A listed group with no flair configured grants nothing, so this is safe to
  # fill in before the badge image is ready — the badges appear when it is
  # uploaded.
  ingenic_official_groups:
    default: "admins"
    type: list
    list_type: compact
    description: "Groups whose members wear an official identity badge beside their username. A member already wearing a badge of their own keeps it."

  # Points: what members earn for contributing, and what a resource can cost to
  # unlock. Switching this off stops the forum handing points out and stops a
  # resource being bought with them; it does not clear the ledger, and the
  # balances are where they were when it comes back on.
  #
  # An administrator adjusting an account by hand still works while this is off,
  # because that is somebody deciding on purpose rather than the forum deciding
  # for them.
  ingenic_points_enabled:
    default: true
    client: false

  # Whether administrators and moderators earn points.
  #
  # On by default: answering here is a member of staff's job rather than their
  # contribution, and a community leaderboard nobody in the community can reach
  # the top of is not much of a leaderboard. Worth knowing while trying the
  # feature out — a moderator posting to test it will see nothing happen.
  #
  # It does not stop staff *giving* points: a like from a moderator still
  # counts for the member who wrote the post.
  ingenic_points_exclude_staff:
    default: true
    client: false

  # 高分悬赏: what a member may offer for an answer on their own topic, and how
  # long the offer stands.
  #
  # A bounty is paid out of the asker's own points, which are set aside the
  # moment the offer is opened. So a bounty cannot be opened on credit, and the
  # points behind one cannot be spent on a download while it stands — they are
  # out of the balance, and the bounty row is the promise that they come back.
  #
  # Accepting an answer is what pays it. There is no separate control for that:
  # the topic author's own ✓ marks the answer and releases the points in the same
  # motion, which is the only way the two can be guaranteed to agree about which
  # answer was paid for. Un-accepting an answer does not take the points back —
  # see Ingenic::Bounties for why.
  #
  # Two things have to be true for the feature to be offered at all: points have
  # to be on, because an escrow is a movement in the ledger, and discourse-solved
  # has to be installed, because a bounty nobody can settle is a promise the
  # forum has no way to keep. The category also has to allow accepted answers;
  # that is checked per topic rather than here.
  #
  # Switching this off stops new offers being opened. It does not strand the ones
  # already standing: the expiry job goes on closing and refunding them, because
  # points in escrow belong to a member whether or not the forum is still selling
  # the feature.
  ingenic_bounties_enabled:
    default: true
    client: false

  # The smallest offer a bounty may be. A floor rather than nothing, because a
  # question with five points on it is not worth anybody's afternoon, and a board
  # full of those buries the ones that are.
  ingenic_bounty_min_points:
    default: 50
    client: false

  # The largest. A ceiling so that one member cannot put a question out of
  # everybody else's reach — a bounty is a way of asking for attention, and there
  # is a size past which it is a way of buying it.
  ingenic_bounty_max_points:
    default: 5000
    client: false

  # How long an offer stands before it is closed and the points go back to their
  # owner. A fortnight is long enough for a question to find somebody who knows
  # the answer, and short enough that points are not parked in escrow for a
  # season. Setting this to 0 closes every new bounty on the next run of the
  # expiry job, which is a way of switching the feature off that still refunds.
  ingenic_bounty_expiry_days:
    default: 14
    client: false

  # 高赞 — the status tag that says a topic's posts have collected enough likes
  # to be worth a reader's time. The tag is applied by a scheduled pass, not by
  # the like event: the count is a total across the topic, and only a pass over
  # the totals can both add and take the tag back.
  #
  # The threshold is the number of likes across every live, regular post in the
  # topic. Twenty is the forum's default. A topic that falls back below it loses
  # the tag only if the pass put it there — a 高赞 a moderator applied by hand is
  # theirs to remove.
  ingenic_high_like_enabled:
    default: true
    client: false

  ingenic_high_like_threshold:
    default: 20
    min: 1
    client: false

  # The contribution score — the weekly ranking on the home page.
  #
  # Separate from points on purpose. Points are money: earned, spent on a
  # download, escrowed for a bounty. Contribution is a reading of how much a
  # member took part, and it is never spent. Switching this off stops the
  # ranking being written and read; it does not touch any balance and does not
  # delete what has already been recorded, so turning it back on resumes the
  # same table.
  #
  # The prices live in Ingenic::Contributions rather than here because they are
  # a shape of the scoring, not an operational choice: a topic, an answer, a
  # like, an accepted answer, a visit.
  ingenic_contributions_enabled:
    default: true
    client: false

  # How far back the "Popular posts" card looks, in days.
  #
  # All-time popularity freezes — the same threads sit at the top for years. A
  # month keeps the card a reading of the forum as it is now, and is long enough
  # that a good answer is not gone before it is read.
  ingenic_popular_window_days:
    default: 30
    min: 1
    client: false
