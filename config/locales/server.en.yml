en:
  site_settings:
    ingenic_enabled: "Enable the Ingenic community extension (documentation versioning, downloads, development boards)."
    ingenic_nav_items: "Left navigation items as a JSON array. Controls label, icon, target, order and visibility."
    ingenic_homepage_blocks: "Homepage blocks as a JSON array. Controls which blocks render and in what order. Types: categories (the forum's sections as a grid, with an entry to all of them), latest (the newest discussions), hot (the busiest this week), popular (most liked in a recent window), activity (the official announcements, newest first), bounties (the richest standing 高分悬赏, drawn only while there are some), announcements, discussions, downloads, boards, promotions. Admin → Plugins → Ingenic → Site content edits this list; left empty, the home page draws the default layout on its own."
    ingenic_docs_discussion_category: "Category slug used for the 'Discuss in forum' link when a documentation page has no linked topic."
    ingenic_download_storage_path: "Directory holding uploaded SDK and firmware files. Empty uses <app>/ingenic-downloads. Must be outside public/."
    ingenic_download_admin_email: "Address notified when a developer applies for an access-restricted download."
    ingenic_download_log_retention_months: "Months a delivery log keeps who took the file. The row itself stays as a count; 0 keeps the account, address and browser forever."
    ingenic_file_manager_path: "Directory holding the official file library. Empty uses <app>/ingenic-files. Must be outside public/."
    ingenic_file_manager_extensions: "File extensions the official file library accepts."
    ingenic_developer_form_fields: "JSON array of extra questions for the developer information form. The core questions are fixed."
    ingenic_official_groups: "Groups whose members wear an official identity badge beside their username. A member already wearing a badge of their own keeps it."
    ingenic_points_enabled: "Award points for contributions, and let a resource cost points to unlock. Switching it off keeps every balance where it is."
    ingenic_points_exclude_staff: "Administrators and moderators do not earn points. A like from one still counts for the member who wrote the post."
    ingenic_bounties_enabled: "Let a member offer points on their own topic, paid to whoever writes the answer they accept. Needs points and the solved plugin. Switching it off stops new offers and still refunds the standing ones."
    ingenic_bounty_min_points: "The smallest offer a bounty may be."
    ingenic_bounty_max_points: "The largest offer a bounty may be."
    ingenic_bounty_expiry_days: "Days an offer stands before it is closed and the points are returned to the asker."
    ingenic_high_like_enabled: "Tag topics the community liked enough with 高赞, and take the tag back when the likes are gone. A tag a moderator applied by hand is never removed by this pass."
    ingenic_high_like_threshold: "How many likes across a topic's live posts earn the 高赞 tag. Twenty is the forum's default; a topic that falls below the threshold loses the tag at the next pass."
    ingenic_contributions_enabled: "Keep the weekly contribution ranking. It is separate from spendable points: a bounty payout does not move it, and switching it off does not touch any balance."
    ingenic_popular_window_days: "How many days back the Popular posts card looks. Likes rank first, views break ties."

